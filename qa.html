<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Local accessibility audit</title><style>#qa-toolbar{position:fixed;left:10px;top:70px;z-index:100;background:#fff;color:#222;padding:10px;font:12px system-ui;max-width:95vw}#qa-toolbar select,#qa-toolbar button{color:#222;background:#eee;margin-right:10px}#result{max-height:280px;overflow:auto;white-space:pre-wrap;max-width:500px}#result:empty{display:none}</style></head><body><div id="root"></div><aside id="qa-toolbar" aria-label="Developer audit"><label>Poem <select id="route"><option value="/ozymandias">Ozymandias</option><option value="/">Collection</option><option value="/ozymandias/plain">Shelley plain</option><option value="/the-second-coming">The Second Coming</option><option value="/the-second-coming/plain">Yeats plain</option></select></label><button id="check">Run accessibility check</button><button id="loss">Simulate graphics loss</button><button id="hidden">Simulate hidden document</button><pre id="result" aria-live="polite"></pre></aside><script type="module" src="/src/main.tsx"></script><script type="module">
import axe from 'axe-core';
if(!location.hash)location.hash='/ozymandias';
document.getElementById('route').onchange=e=>{location.hash=e.target.value;document.getElementById('result').textContent=''};
const audit=async()=>{const target=document.getElementById('result');target.textContent='Checking…';try{await document.fonts.ready;const result=await axe.run({exclude:[['#qa-toolbar']]},{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']}});target.textContent=JSON.stringify({violations:result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passes:result.passes.length,incomplete:result.incomplete.map(v=>({id:v.id,nodes:v.nodes.map(n=>n.target)}))},null,2)}catch(error){target.textContent=String(error)}};
document.getElementById('check').onclick=audit;
document.getElementById('loss').onclick=()=>document.querySelector('canvas')?.getContext('webgl2')?.getExtension('WEBGL_lose_context')?.loseContext();
let simulatedHidden=false;const originalHidden=Object.getOwnPropertyDescriptor(document,'hidden');
document.getElementById('hidden').onclick=()=>{simulatedHidden=!simulatedHidden;if(simulatedHidden)Object.defineProperty(document,'hidden',{configurable:true,get:()=>true});else if(originalHidden)Object.defineProperty(document,'hidden',originalHidden);else delete document.hidden;document.dispatchEvent(new Event('visibilitychange'));document.getElementById('hidden').textContent=simulatedHidden?'Restore visible document':'Simulate hidden document'};
document.addEventListener('toggle',event=>{if(event.target instanceof HTMLDialogElement&&event.target.open)requestAnimationFrame(audit)},true);
</script></body></html>
